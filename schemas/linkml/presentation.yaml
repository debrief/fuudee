id: https://debrief.info/schemas/debrief/presentation
name: debrief_presentation
title: "Presentation: how the analyst shows a plot (SUB-22)"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core

description: >-
  The analyst's changes to how a plot is shown: a track's colour, and which
  features are hidden on the map. Kept beside the plot (presentation.json),
  so they travel with it, but outside its history: presentation changes are
  undoable through a local history and never recorded in provenance
  (SUB-22). They override the style a plot was imported with; they never
  change the plot.

classes:
  Presentation:
    attributes:
      schema_version: {range: SchemaVersion, required: true}
      features:
        description: Each feature the analyst has restyled or hidden, once.
        range: FeaturePresentation
        multivalued: true
        inlined_as_list: true
        required: true

  FeaturePresentation:
    attributes:
      id:
        description: The feature's id in the plot.
        required: true
      colour:
        description: Lower-case hex RGB, for a track; overrides the colour it was imported with.
        pattern: "^#[0-9a-f]{6}$"
      hidden:
        description: Not drawn on the map. Still listed, and still selectable, in the outline.
        range: boolean
