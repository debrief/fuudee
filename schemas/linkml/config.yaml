id: https://debrief.info/schemas/debrief/config
name: debrief_config
title: "Per-user configuration: known stores (SEC-06)"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types

description: >-
  The analyst's own configuration, one JSON file per user account, read and
  written by both the Python services and the VS Code extension. It lists
  the stores Debrief knows about. It holds no protection marking: that
  belongs to the catalogue itself (SEC-02), so every analyst sees the same.

  The file carries its own config_version rather than the data-file schema
  version: it is not data, so it must survive a schema change. A Debrief
  that finds a newer config_version refuses to overwrite it.

enums:
  TrackImportModeEnum:
    description: >-
      How tracks imported are plotted: ask for each track (the default), or
      one choice the analyst said to use for future imports. User state,
      kept here and never in a catalogue or a plot file.
    permissible_values:
      ask: {description: "Ask, for each track imported, whether it is plotted over the ground or by dead reckoning."}
      otg: {description: "Over the ground: each fix where it was logged."}
      dr: {description: "Dead reckoning: from the first fix, by each fix's recorded course and speed."}
  StoreKindEnum:
    description: How a store is reached. Only static file catalogues so far (SUB-15).
    permissible_values:
      file: {description: "A static STAC catalogue in a local or shared folder."}

classes:
  UserConfig:
    attributes:
      config_version:
        description: "Version of this file's layout: 1 while it holds only stores; 2 once it holds track_import_mode; 3 once it holds narrative_import. An earlier Debrief cannot read a later layout."
        range: integer
        required: true
        minimum_value: 1
      stores:
        description: Known stores, in the order the analyst sees them (SUB-17).
        range: KnownStore
        multivalued: true
        inlined_as_list: true
        required: true
      track_import_mode:
        description: >-
          How tracks imported are plotted, over the ground or by dead
          reckoning: ask (the default, also when left out), or otg or dr
          once the analyst chose "Use this choice for future imports"
          (CAP-01). The analyst may clear it, to be asked again.
        range: TrackImportModeEnum
      narrative_import:
        description: >-
          The analyst's last answers to the questions asked before a Word or
          PDF narrative is read into a plot, one set for each dialect, so they
          are offered again next time and confirmed with one key (CAP-19;
          product owner, 15 Oct 2026). User state, kept here and never in a
          catalogue or a plot file; importers are given the answers.
        range: NarrativeImportAnswers
        multivalued: true
        inlined_as_list: true

  NarrativeImportAnswers:
    description: >-
      What the analyst answered for documents of one dialect: the types not
      read (so a type not seen before is read), whether only entries within the
      plot's period, and the track each platform was said to be.
    attributes:
      dialect:
        description: The dialect, such as narrative-document or rider-narrative.
        required: true
        pattern: "^[a-z][a-z0-9-]{0,63}$"
      skip_types:
        description: Entry types the analyst chose not to read; "" for entries with no type.
        multivalued: true
      within_period:
        description: Only the entries within the plot's tracks' period.
        range: boolean
      tracks:
        description: The track the analyst said each platform is, by the track's name.
        range: PlatformTrack
        multivalued: true
        inlined_as_list: true

  PlatformTrack:
    description: A platform, as a document names it, and the track it was said to be.
    attributes:
      platform:
        required: true
      track:
        description: The track's name; left out, the platform belongs to no track.

  KnownStore:
    attributes:
      id:
        description: Unique within this file; stable when the store is renamed.
        required: true
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      title:
        description: The name the analyst sees.
        required: true
      kind: {range: StoreKindEnum, required: true}
      location:
        description: >-
          Absolute path to the folder holding catalog.json: a POSIX path, a
          Windows drive path or a UNC share.
        required: true
        pattern: "^(/|[A-Za-z]:[\\\\/]|\\\\\\\\[^\\\\])"
      read_only:
        description: >-
          When true, Debrief offers no action that would write to the store.
          A courtesy, not access control: filesystem permissions decide that
          (SEC-01).
        range: boolean
