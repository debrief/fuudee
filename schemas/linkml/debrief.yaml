id: https://debrief.info/schemas/debrief
name: debrief
title: Debrief data-file schema
description: >-
  Every type that crosses a process or language boundary in Debrief v4,
  generated into Python, JSON Schema and TypeScript (PRN-04). The version
  below is the data-file schema version (SUB-12); see schemas/CHANGELOG.md.
version: 0.0.9
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core
  - geojson
  - prov
  - features
  - stac
  - state
  - tools
  - formatting
  - config
  - messages
  - history
