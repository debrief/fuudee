id: https://debrief.info/schemas/debrief/measures
name: debrief_measures
title: "Measures, measure groups and the Tote (CAP-06, CAP-07)"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core

description: >-
  The Tote shows relative geometry between one primary track and several
  secondaries at current time (CAP-06). It is a view onto a measure group: a
  named, reusable set of measures tied to a mode of analysis (CAP-07). Every
  group extends the shared core, which Debrief defines; a study's lead
  analyst will define further groups, kept in the study catalogue. Measures
  are worked out in Python (PRN-03); views only format them, with the
  analyst's settings (SUB-04).

enums:
  MeasureSubjectEnum:
    description: What a measure is of.
    permissible_values:
      relative: {description: "Between the primary and a secondary, such as range: needs both at current time."}
      own: {description: "Of one track on its own, such as its course: shown for the primary and each secondary."}
  MeasureDisplayEnum:
    description: How a measure's value is written for people, by the formatting service (SUB-04).
    permissible_values:
      quantity: {description: "In the analyst's unit for its kind, such as 1.25 nmi or 12.0 kn."}
      bearing: {description: "Three figures, true: 045.0°T."}
      relative_bearing: {description: "From the primary's head, port red and starboard green: R045.0° or G045.0°."}
      depth: {description: "A depth, in metres, or feet where the analyst's lengths are imperial."}
  ToteRowStatusEnum:
    description: Whether a track in the Tote has values at current time.
    permissible_values:
      ok: {description: "The track has data at current time."}
      no_data: {description: "Current time is before the track starts or after it ends: nothing to show (note says which)."}
      missing: {description: "The plot no longer has this track (merged or deleted since it was chosen)."}

classes:
  MeasureDefinition:
    description: >-
      One measure the Tote can show. The core measures are Debrief's own; a
      study may add more (CAP-07), each worked out in Python.
    attributes:
      id:
        description: Unique among measures, such as range or relative_bearing.
        required: true
        pattern: "^[a-z][a-z0-9_]*$"
      title:
        description: Its name in full, for hover text and screen readers.
        required: true
      label:
        description: Its column heading, short enough for a narrow view.
        required: true
      subject: {range: MeasureSubjectEnum, required: true}
      quantity_kind: {range: QuantityKindEnum, required: true}
      display: {range: MeasureDisplayEnum, required: true}
      explanation:
        description: How it is worked out, in a sentence.
  MeasureGroup:
    description: >-
      A named, reusable set of measures tied to a mode of analysis (CAP-07),
      shown by the Tote in this order. Every group extends the shared core:
      extends names the group it adds to (core itself extends nothing). A
      study's own groups will be defined by its lead analyst and kept in the
      study catalogue, shared by every plot in the study.
    attributes:
      id:
        required: true
        pattern: "^[a-z][a-z0-9_-]*$"
      title: {required: true}
      description: {}
      extends:
        description: The group whose measures come first, before this one's own; left out for core.
      measures:
        description: The ids of the measures shown, in order, those of the group it extends included.
        multivalued: true
        required: true
  ToteView:
    description: >-
      Which tracks the Tote compares, and through which measure group: view
      state in the plot's island, like the time window, so it travels with
      the plot file but is never a step in its history and never undone
      (SUB-22; decision, 14 Oct 2026). Ids of tracks no longer in the plot
      are shown as missing, not refused, because a change to content never
      changes the island.
    attributes:
      primary:
        description: The track the others are measured from; left out until one is chosen.
      secondaries:
        description: The tracks measured from the primary, in the order shown.
        multivalued: true
      measure_group:
        description: The measure group shown; left out means core.
      map_lines:
        description: >-
          Whether the map draws a thin line from the primary to each secondary
          at current time; left out means it does (decision, 14 Oct 2026).
        range: boolean
  MeasureValue:
    description: One measure's value at current time; value left out where it cannot be worked out (no depth recorded, say).
    attributes:
      measure: {required: true}
      value: {range: float}
      unit:
        description: The UCUM unit of value, such as m, deg or m/s; formatted for people by the views (SUB-04).
  ToteRow:
    description: One track in the Tote at current time.
    attributes:
      track:
        description: The track's feature id.
        required: true
      name: {}
      colour:
        description: The track's colour, lower-case hex, to key the row to the map.
        pattern: "^#[0-9a-f]{6}$"
      status: {range: ToteRowStatusEnum, required: true}
      note:
        description: Why there are no values, for the analyst, such as "Starts 09:30:00Z".
      values:
        range: MeasureValue
        multivalued: true
        inlined_as_list: true
  ToteResult:
    description: >-
      The Tote at one time: the primary's own measures, and each secondary's
      measures relative to the primary and its own, as debrief/tote returns
      them and the Tote view shows them.
    attributes:
      time:
        description: The time the values are for.
        range: UtcTimestamp
        required: true
      group: {range: MeasureGroup, required: true, inlined: true}
      measures:
        description: The definitions of the group's measures, in its order.
        range: MeasureDefinition
        multivalued: true
        inlined_as_list: true
        required: true
      primary: {range: ToteRow, inlined: true}
      note:
        description: >-
          What the analyst should know about the Tote as a whole, such as a
          measure group chosen that this plot's study does not have (core is
          shown instead).
      rows:
        description: One per secondary, in the order chosen.
        range: ToteRow
        multivalued: true
        inlined_as_list: true
        required: true
  ToteTrack:
    description: A track the analyst can put in the Tote, as the Tote view lists them.
    attributes:
      id: {required: true}
      name: {required: true}
      colour:
        pattern: "^#[0-9a-f]{6}$"
