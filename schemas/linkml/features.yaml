id: https://debrief.info/schemas/debrief/features
name: debrief_features
title: "Debrief plot features: the GeoJSON profile"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
  prov: http://www.w3.org/ns/prov#
  geojson: https://purl.org/geojson/vocab#
  stac: https://stacspec.org/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core
  - geojson
  - prov
  - measures

description: >-
  A plot is a GeoJSON FeatureCollection (SUB-05). Every feature carries its
  kind in properties.kind; the kinds form the taxonomy tools declare against
  (TL-06). Each feature class has its own single-value kind enum so that
  validators can tell the classes apart.

  A plot may hold one whole-plot feature (kind plot) with the plot's own
  details. Its view property is the plot's island: view state such as the
  plot's time window, kept in the plot file so the plot travels as one file,
  but outside its history. The island is left out of history hashing and
  replay, is not undoable and is never recorded in provenance (SUB-22).
  Everything else in the plot, the whole-plot feature's title included, is
  content: recorded, undoable, with provenance.

enums:
  FeatureTypeEnum: {permissible_values: {Feature: {}}}
  FeatureCollectionTypeEnum: {permissible_values: {FeatureCollection: {}}}
  FeatureKindEnum:
    description: The feature taxonomy (TL-06).
    permissible_values:
      track: {}
      annotation: {}
      sensor_observations: {}
      plot: {description: "The whole plot: its own details and its view. At most one per plot."}
      narrative: {description: "A narrative entry: what a platform, a person or a document logged at a time, with no position (CAP-19, CAP-20)."}
  PlotKindEnum: {permissible_values: {plot: {}}}
  ContextTracksEnum:
    description: >-
      How the map draws each track outside the time window: its context
      (CAP-29). An analyst's setting for the minimum contrast can show faint
      as visible, never hidden as anything else.
    permissible_values:
      visible: {description: "Easy to see on any theme: at least 3:1 against the map's background."}
      faint: {description: "Fainter, for a busy plot. Not guaranteed to reach 3:1."}
      hidden: {description: "Not drawn: only what is in the time window shows."}
  TrackKindEnum: {permissible_values: {track: {}}}
  TrackEditActionEnum:
    description: What a track edit does (CAP-01).
    permissible_values:
      move: {description: "Every fix in the period goes the same range along the same bearing."}
      rotate: {description: "Every fix in the period turns about the pivot by the angle, keeping its range from it."}
      shear: {description: "One end of the period is held; the other is dragged, and every fix moves in proportion to its time from the held end, so course and speed change together (TMA shear)."}
      stretch: {description: "One end of the period is held; every fix's range from it is scaled, so speeds change and courses do not (TMA stretch)."}
      move_fix: {description: "One fix, found by its time (fix_time), goes to a new place: a distance along a bearing, or a position. Its time, its recorded course and speed, its mark and every other fix stay as they were."}
      set_plotting_mode: {description: "The track plotted over the ground (OTG) or by dead reckoning (DR): plotting_mode says which."}
  PlottingModeEnum:
    description: >-
      How a track is plotted, as legacy Debrief asked of each track imported
      (CAP-01, decision, product owner, 14 Oct 2026).
    permissible_values:
      otg: {description: "Over the ground: each fix where it was logged."}
      dr: {description: "Dead reckoning: the first fix where it was logged, and each fix after it placed from the one before by that fix's recorded course and speed over the time between, along the geodesic."}
  TrackEditAnchorEnum:
    description: Which end of the period a shear or a stretch holds fixed; the other end is the one dragged.
    permissible_values:
      start: {description: "The period's first fix is held; its last is dragged."}
      end: {description: "The period's last fix is held; its first is dragged."}
  AnnotationKindEnum: {permissible_values: {annotation: {}}}
  SensorObservationsKindEnum: {permissible_values: {sensor_observations: {}}}
  NarrativeKindEnum: {permissible_values: {narrative: {}}}
  AnnotationStyleEnum:
    description: What an annotation depicts (CAP-03, CAP-04).
    permissible_values:
      label: {}
      shape: {}
      chart_furniture: {}
      note: {description: "Free-text note, usually time-only."}
      time_period: {description: "A period of interest, time-only (TL-11)."}
  AnnotationShapeEnum:
    description: >-
      How an annotation is drawn (CAP-03). Left out, it follows from the
      geometry: a line string is a line, a polygon an area, a point a label
      (style label) or a marker, and no geometry a note. Circles and ellipses
      must say so, since GeoJSON has no curves: their geometry is a polygon
      that approximates them, for other tools, and their own properties
      (centre, radius or semi-axes and orientation) say exactly what they are.
    permissible_values:
      line: {description: "A line through two or more positions, drawn along geodesics."}
      area: {description: "A closed area with three or more corners, drawn along geodesics."}
      circle: {description: "Every position at one range from a centre, measured along geodesics."}
      ellipse: {description: "An ellipse about a centre, its axes measured along geodesics from it."}
      label: {description: "Text at a position."}
      marker: {description: "A marked position."}
      note: {description: "Text at a time, with no position (CAP-04)."}
  LineStyleEnum:
    description: How an annotation's line is drawn.
    permissible_values:
      solid: {}
      dashed: {}
      dotted: {}
  LabelPositionEnum:
    description: Where an annotation's label is drawn, relative to it.
    permissible_values:
      above: {}
      below: {}
      left: {}
      right: {}
      centre: {}
      none: {description: "No label on the map; the annotation is still named in the outline."}
  ChartFurnitureEnum:
    description: Chart furniture a plot can carry (CAP-03). The scale bar is always drawn.
    permissible_values:
      north_arrow: {description: "An arrow pointing to true north, in a corner of the map."}
  ObservationTypeEnum:
    description: Sensor observation types Debrief imports (CAP-22). Frequency is never imported.
    permissible_values:
      bearing: {}
      ambiguous_bearing: {description: "Towed-array bearing with two candidate sides."}
  PayloadFormatEnum:
    description: Standard formats for opaque payloads (CON-02).
    permissible_values:
      arrow: {}
      parquet: {}
      geojson: {}

classes:
  # --- Tracks ---------------------------------------------------------------
  TrackFeature:
    description: A platform track. Per-position values are parallel arrays matching the geometry.
    attributes:
      type: {range: FeatureTypeEnum, required: true}
      id: {required: true}
      geometry: {range: LineStringGeometry, required: true, inlined: true}
      properties: {range: TrackProperties, required: true, inlined: true}
  TrackProperties:
    attributes:
      kind: {range: TrackKindEnum, required: true}
      name: {required: true}
      platform_class: {}
      times:
        description: One per position, non-decreasing.
        range: UtcTimestamp
        multivalued: true
        required: true
      speeds:
        description: Speed over ground at each position.
        range: SpeedSeries
        inlined: true
      courses:
        description: Course over ground at each position, true north, clockwise.
        range: AngleSeries
        inlined: true
      depths:
        description: >-
          Depth below the sea surface at each position, positive down. Absent
          where depth is not known.
        range: LengthSeries
        inlined: true
      style: {range: TrackStyle, inlined: true}
      fix_marks:
        description: >-
          Fixes with a colour, a label or a comment of their own, in time
          order, each found by its time (CAP-01, EXT-14). Most fixes have
          none, so only marked fixes are listed. Content: each change is a
          recorded, undoable step (SUB-22).
        range: FixMark
        multivalued: true
        inlined_as_list: true
      plotting_mode:
        description: >-
          How the track is plotted: over the ground (otg, as logged; also
          when left out) or by dead reckoning (dr), chosen as it was imported
          and changed as a recorded, undoable step (CAP-01, SUB-22). The
          geometry is always the positions as plotted, so other GeoJSON tools
          draw what Debrief draws.
        range: PlottingModeEnum
      logged_positions:
        description: >-
          A track plotted by dead reckoning: its positions as logged, over
          the ground, one per fix, so plotting it over the ground again puts
          them back. Left out for a legacy plot's DR leg, which saved only
          the positions it worked out.
        range: LineStringGeometry
        inlined: true
      logged_courses:
        description: >-
          A track plotted by dead reckoning: its courses as logged, one per
          fix, as they were when it was plotted so. On a DR track the
          courses and speeds are what edits change (decision, product
          owner, 14 Oct 2026), so these tell what was changed while plotted
          by dead reckoning, and plotting it over the ground again puts them
          back.
        range: AngleSeries
        inlined: true
      logged_speeds:
        description: >-
          A track plotted by dead reckoning: its speeds as logged, one per
          fix, as they were when it was plotted so; see logged_courses.
        range: SpeedSeries
        inlined: true
      hidden:
        description: >-
          Not drawn on the map. Still listed, and still selectable, in the
          outline. Content: hiding is a recorded, undoable change (SUB-22).
        range: boolean
      provenance:
        description: Feature-level provenance where needed (SUB-18).
        range: ProvRecord
        multivalued: true
        inlined_as_list: true
  TrackStyle:
    description: >-
      How a track is drawn. Data colours do not change with the theme
      (DEV-07). Colour is content: the analyst changing it (blue friendly to
      red enemy, say) is a recorded, undoable change (SUB-22).
    attributes:
      colour:
        description: Lower-case hex RGB, for example "#e01c3e".
        required: true
        pattern: "^#[0-9a-f]{6}$"
      legacy_symbology:
        description: The REP symbology code the colour came from, such as "@C", kept for export.
  FixMark:
    description: >-
      One fix of a track marked by the analyst, or by a legacy plot: drawn in
      a colour of its own, labelled on the map, or carrying a comment. Found
      by its time, not its place in the track, so a mark stays with its fix
      when fixes before it are removed, the track is split or merged, or it
      is moved, rotated, sheared, stretched or smoothed. Where two fixes
      share a time, the mark is the first's.
    attributes:
      time:
        description: The time of the fix marked; one of the track's times.
        range: UtcTimestamp
        required: true
      colour:
        description: >-
          The fix's own colour, lower-case hex RGB: its marker and the line
          from it to the next fix are drawn in it.
        pattern: "^#[0-9a-f]{6}$"
      label:
        description: Text drawn on the map beside the fix.
      comment:
        description: Free text about the fix, shown when the analyst points at it and in the Timeline.

  TrackEdit:
    description: >-
      A track moved, rotated, sheared or stretched by hand, as the map, a
      form or an agent describes it (CAP-01, CAP-02, CAP-21): one recorded,
      undoable step in the plot's history (SUB-19). Geodesic: a move takes
      every fix in the period the same range along the same bearing, each
      along its own geodesic; a rotation keeps each fix's range from the
      pivot and turns its bearing from the pivot by the angle. A shear and a
      stretch hold one end of the period (the anchor) and work in the
      azimuthal equidistant frame about it, where a geodesic through the
      anchor is a straight line: a shear adds to each fix the dragged end's
      displacement times the fix's fraction of the time from the anchor to
      the dragged end; a stretch scales each fix's range from the anchor,
      keeping its bearing from it. Either way a straight, steady leg stays a
      straight, steady leg. Fixes outside the period stay where they are, so
      the joins jump. A single fix moved (move_fix) goes where it is told,
      alone: its neighbours, its time and its recorded course and speed
      stay. set_plotting_mode with plotting_mode dr plots the whole track by
      dead reckoning, each fix placed from the one before by that fix's
      recorded course and speed, from the track's first fix; with otg it
      puts the fixes back where they were logged, after the analyst confirms
      losing any change made while plotted by dead reckoning
      (discard_dr_changes).
    attributes:
      action: {range: TrackEditActionEnum, required: true}
      period:
        description: >-
          The fixes to change: those whose times fall in it, ends included.
          Left out, the whole track.
        range: TimeRange
        inlined: true
      distance:
        description: How far a move takes each fix, a shear drags the end that is not held, or a single fix is moved.
        range: Length
        inlined: true
      bearing:
        description: Which way a move takes each fix, a shear drags the end that is not held, or a single fix is moved, true, clockwise from north.
        range: Angle
        inlined: true
      angle:
        description: How far a rotation turns the fixes about the pivot; positive is clockwise.
        range: Angle
        inlined: true
      pivot:
        description: >-
          [longitude, latitude] of the position a rotation turns about. Left
          out, the fix nearest current time in the period, or the period's
          first fix.
        range: float
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      anchor:
        description: The end of the period a shear or a stretch holds fixed.
        range: TrackEditAnchorEnum
      course:
        description: >-
          The course made good a shear gives the period: the true bearing,
          at its first fix, of the geodesic from its first fix to its last.
          With speed, instead of a distance and a bearing for the dragged end.
        range: Angle
        inlined: true
      speed:
        description: >-
          The speed made good a shear or a stretch gives the period: the
          geodesic range from its first fix to its last over the time between.
        range: Speed
        inlined: true
      fix_time:
        description: >-
          The time of the one fix a move_fix moves: the fix is found by its
          time, as a mark is (where two fixes share a time, the first).
        range: UtcTimestamp
      position:
        description: >-
          [longitude, latitude] a move_fix puts the fix at, instead of a
          distance and a bearing from where it is.
        range: float
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
      plotting_mode:
        description: How set_plotting_mode plots the track, over the ground or by dead reckoning.
        range: PlottingModeEnum
      discard_dr_changes:
        description: >-
          set_plotting_mode to otg only: plot the track over the ground
          although it was changed while plotted by dead reckoning, losing
          those changes, as the analyst confirmed (decision, product owner,
          14 Oct 2026). Without it such a change is refused, saying why.
        range: boolean

  # --- Annotations ----------------------------------------------------------
  AnnotationFeature:
    description: >-
      Shapes, labels and chart furniture as ordinary GeoJSON (CAP-03). An
      annotation with only a time has null geometry and shall give a time or a
      time range (CAP-04); chart furniture has null geometry and needs neither.
      A circle or an ellipse is a polygon approximating it, for other tools,
      with its centre and size as properties, which Debrief draws from.
    attributes:
      type: {range: FeatureTypeEnum, required: true}
      id: {required: true}
      geometry:
        inlined: true
        any_of:
          - range: PointGeometry
          - range: LineStringGeometry
          - range: PolygonGeometry
      properties: {range: AnnotationProperties, required: true, inlined: true}
  AnnotationProperties:
    attributes:
      kind: {range: AnnotationKindEnum, required: true}
      style: {range: AnnotationStyleEnum, required: true}
      name: {required: true}
      text: {}
      time: {range: UtcTimestamp}
      time_range: {range: TimeRange, inlined: true}
      shape:
        description: >-
          How it is drawn. Required for circles and ellipses; otherwise it
          may be left out and follows from the geometry.
        range: AnnotationShapeEnum
      centre:
        description: >-
          The centre of a circle or an ellipse, [longitude, latitude] in WGS84
          degrees. Its geometry is the polygon that approximates it.
        range: float
        array:
          exact_number_dimensions: 1
          dimensions:
            - exact_cardinality: 2
      radius:
        description: A circle's radius, along geodesics from its centre.
        range: Length
        inlined: true
      semi_major:
        description: Half an ellipse's longer axis, along the geodesic from its centre.
        range: Length
        inlined: true
      semi_minor:
        description: Half an ellipse's shorter axis, along the geodesic from its centre.
        range: Length
        inlined: true
      orientation:
        description: >-
          The direction of an ellipse's longer axis from its centre, true
          north, clockwise.
        range: Angle
        inlined: true
      furniture:
        description: >-
          What chart furniture it is. Chart furniture has no geometry and needs
          no time.
        range: ChartFurnitureEnum
      appearance:
        description: >-
          How it is drawn on the map. Left out, or any member of it left out,
          means Debrief's default for annotations. Content, like a track's
          colour: changing it is a recorded, undoable change (SUB-22).
        range: AnnotationAppearance
        inlined: true
      hidden:
        description: >-
          Not drawn on the map. Still listed, and still selectable, in the
          outline. Content: hiding is a recorded, undoable change (SUB-22).
        range: boolean
      provenance:
        range: ProvRecord
        multivalued: true
        inlined_as_list: true

  AnnotationAppearance:
    description: >-
      How an annotation is drawn: its line, its fill and its label. Data
      colours do not change with the theme (DEV-07). Widths and sizes are in
      screen pixels, so they are the same at every zoom.
    attributes:
      colour:
        description: >-
          Its line's colour, and a label's or a marker's dot. Lower-case hex
          RGB, for example "#c7820a". Label text is drawn in the theme's text
          colour, so it stays readable on any map.
        pattern: "^#[0-9a-f]{6}$"
      line_style: {range: LineStyleEnum}
      line_width:
        description: Width of its line in screen pixels.
        range: integer
        minimum_value: 1
        maximum_value: 10
      fill_colour:
        description: >-
          Colour inside an area, circle or ellipse. Lower-case hex RGB. Left
          out, the line's colour.
        pattern: "^#[0-9a-f]{6}$"
      fill_opacity:
        description: >-
          How opaque the fill of an area, circle or ellipse is, from 0 (none)
          to 1 (solid). Left out, 0.25 with a fill colour, or else a faint
          tint of 0.05, so what lies inside stays clear.
        range: float
        minimum_value: 0
        maximum_value: 1
      label_size:
        description: Height of its label's text in screen pixels.
        range: integer
        minimum_value: 8
        maximum_value: 32
      label_position: {range: LabelPositionEnum}

  AnnotationSpec:
    description: >-
      An annotation as the analyst describes it in a form, or an agent in a
      request: what is made into an annotation feature, recorded as one step
      in the plot's history (CAP-03, SUB-19). Positions are numbers here;
      forms read them in the analyst's notation and say what they mean.
    attributes:
      shape: {range: AnnotationShapeEnum, required: true}
      name: {required: true}
      text: {}
      positions:
        description: >-
          [longitude, latitude] pairs: the line's positions, or the area's
          corners (not closed); one, the centre or position, for a circle,
          ellipse, label or marker; none for a note.
        range: float
        array:
          exact_number_dimensions: 2
          dimensions:
            - minimum_cardinality: 1
            - exact_cardinality: 2
      radius: {range: Length, inlined: true}
      semi_major: {range: Length, inlined: true}
      semi_minor: {range: Length, inlined: true}
      orientation: {range: Angle, inlined: true}
      time: {range: UtcTimestamp}
      time_range: {range: TimeRange, inlined: true}
      appearance: {range: AnnotationAppearance, inlined: true}

  # --- Narrative ------------------------------------------------------------
  NarrativeFeature:
    description: >-
      One narrative entry (CAP-19, CAP-20, EXT-14): what a platform, a person
      or a document logged at a time. A feature of its own with null geometry,
      as a time-only annotation is, so other GeoJSON tools read it, and each
      entry added, changed or deleted is one small recorded, undoable step
      (SUB-19). Every narrative feature in a plot together makes the plot's
      narrative: one combined Zulu time axis, however many sources it came
      from, in the order narrative_order gives (time; then source, ignoring
      case; then the plot's order, so a log's own order at one time is kept).
    attributes:
      type: {range: FeatureTypeEnum, required: true}
      id: {required: true}
      geometry:
        description: Always null.
        range: PointGeometry
        inlined: true
      properties: {range: NarrativeProperties, required: true, inlined: true}
  NarrativeProperties:
    attributes:
      kind: {range: NarrativeKindEnum, required: true}
      time:
        description: When it was logged, to the millisecond, Zulu (SUB-01).
        range: UtcTimestamp
        required: true
      source:
        description: >-
          Who wrote it: the platform, person or document whose log it is
          (legacy Debrief's track name on an entry), such as "BLUE ONE".
        required: true
      entry_type:
        description: >-
          What kind of entry, in the source's own words, such as legacy
          Debrief's GenComment, Posn, CSD or FCS. Free text: each source has
          its own types. Left out where the source gives none.
      text:
        description: What was logged. May run to several lines.
        required: true
      track_id:
        description: >-
          The track the entry belongs to, where one is known: by default the
          track named as its source. A track since deleted leaves the link,
          which is then ignored.
      provenance:
        range: ProvRecord
        multivalued: true
        inlined_as_list: true

  NarrativeSpec:
    description: >-
      A narrative entry as the analyst describes it in a form, or an agent in
      a request (debrief/add_narrative, debrief/edit_narrative): made into a
      narrative feature as one recorded step (CAP-20).
    attributes:
      time: {range: UtcTimestamp}
      source: {}
      entry_type: {}
      text: {}
      track_id: {}

  # --- Sensor observations --------------------------------------------------
  SensorObservationsFeature:
    description: >-
      A set of sensor observations, such as weeks of bearings, held as an
      opaque payload (CON-02, NFR-06). Geometry is null; positions come from
      the host track at each observation time.
    attributes:
      type: {range: FeatureTypeEnum, required: true}
      id: {required: true}
      geometry:
        description: Always null.
        range: PointGeometry
        inlined: true
      properties: {range: SensorObservationsProperties, required: true, inlined: true}
  SensorObservationsProperties:
    attributes:
      kind: {range: SensorObservationsKindEnum, required: true}
      name: {required: true}
      sensor_name: {required: true}
      host_track_id:
        description: The track carrying the sensor.
        required: true
      observation_type: {range: ObservationTypeEnum, required: true}
      time_range: {range: TimeRange, required: true, inlined: true}
      observation_count: {range: integer, required: true, minimum_value: 0}
      payload: {range: PayloadRef, required: true, inlined: true}
      hidden:
        description: >-
          Not drawn on the map. Still listed, and still selectable, in the
          outline. Content: hiding is a recorded, undoable change (SUB-22).
        range: boolean
      provenance:
        range: ProvRecord
        multivalued: true
        inlined_as_list: true

  PayloadRef:
    description: >-
      Envelope for data LinkML expresses badly (CON-02): the payload's format,
      a versioned reference to its inner schema, units, CRS and time reference.
    attributes:
      href:
        description: Path relative to the referencing file.
        required: true
      format: {range: PayloadFormatEnum, required: true}
      inner_schema: {range: InnerSchemaRef, required: true, inlined: true}
      columns:
        range: PayloadColumn
        multivalued: true
        inlined_as_list: true
        required: true
      crs:
        description: Coordinate reference system of any positions in the payload.
        required: true
      time_reference:
        description: Time scale of any times in the payload. Always UTC (SUB-01).
        required: true
      content_hash: {range: ContentHash, required: true}
  InnerSchemaRef:
    attributes:
      name: {required: true}
      version: {range: SchemaVersion, required: true}
  PayloadColumn:
    attributes:
      name: {required: true}
      quantity_kind: {range: QuantityKindEnum}
      unit:
        description: UCUM unit code, required when quantity_kind is given.

  # --- The whole plot -------------------------------------------------------
  PlotFeature:
    description: >-
      The whole plot: its own details, and its view (the island). At most one
      per plot. Geometry is always null, so the plot file stays plain GeoJSON
      for other tools.
    attributes:
      type: {range: FeatureTypeEnum, required: true}
      id: {required: true}
      geometry:
        description: Always null.
        range: PointGeometry
        inlined: true
      properties: {range: PlotProperties, required: true, inlined: true}
  PlotProperties:
    attributes:
      kind: {range: PlotKindEnum, required: true}
      title:
        description: The plot's title. Content, like everything outside view.
      description:
        description: What the plot is for. Content.
      view:
        description: >-
          The island: how the plot is being viewed. Outside the plot's
          history (see the module description). Kept last, so it is easy to
          find and strip.
        range: PlotView
        inlined: true
  PlotView:
    description: >-
      View state saved in the plot file: not content, so not undoable and not
      recorded in provenance (SUB-22). Two people changing it at once are
      told, not silently overwritten (SUB-28). Later view state joins here.
    attributes:
      time_window:
        description: >-
          The plot's time window: the period shown, one for the whole plot
          (CAP-28, CAP-29). Start shall not be after end.
        range: TimeRange
        inlined: true
      context_tracks:
        description: >-
          How tracks outside the time window are drawn (CAP-29). Left out
          means visible.
        range: ContextTracksEnum
      tote:
        description: >-
          Which tracks the Tote compares, and through which measure group
          (CAP-06, CAP-07). View state, like the window: changing it is never
          a step in the history (decision, 14 Oct 2026).
        range: ToteView
        inlined: true

  # --- Named sets and the collection ---------------------------------------
  NamedSet:
    description: A saved, reusable selection (TL-11).
    attributes:
      id: {required: true}
      name: {required: true}
      feature_ids: {multivalued: true, required: true}

  DebriefFeatureCollection:
    tree_root: true
    description: The unit of analysis (SUB-05), stored as an asset of a STAC item.
    attributes:
      type: {range: FeatureCollectionTypeEnum, required: true}
      schema_version: {range: SchemaVersion, required: true}
      features:
        multivalued: true
        inlined_as_list: true
        required: true
        any_of:
          - range: TrackFeature
          - range: AnnotationFeature
          - range: SensorObservationsFeature
          - range: NarrativeFeature
          - range: PlotFeature
      named_sets:
        range: NamedSet
        multivalued: true
        inlined_as_list: true
      provenance:
        range: ProvRecord
        multivalued: true
        inlined_as_list: true
        required: true
      history:
        description: >-
          The plot's whole history: every step, with its provenance and
          whether it is applied, undone or abandoned, and the current step
          (SUB-19, SUB-21, decision 13 Oct). A GeoJSON foreign member, so
          other tools still read the file as GeoJSON. Not content: left out
          of every content hash. Last in the file. A plot sent to a view or
          a tool never carries it.
        range: PlotHistory
        inlined: true
