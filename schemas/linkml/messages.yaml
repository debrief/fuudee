id: https://debrief.info/schemas/debrief/messages
name: debrief_messages
title: "Messages between the extension host and webviews (CON-08)"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core
  - features
  - state
  - tools

description: >-
  Every message the VS Code extension host and its webviews (map, time
  controller, tool form, results) send each other. They cross a process boundary, so they are
  boundary types (CON-01, CON-08), validated on receipt. The same messages
  will serve the web build's host (CON-05). Which members each kind needs is
  checked by the receiver.

enums:
  WebviewMessageKindEnum:
    permissible_values:
      ready: {description: "Webview to host: loaded and listening."}
      show_plot: {description: "Host to map: draw this plot (plot, plot_title, selection, and current time and viewport if known, and how many features are hidden)."}
      set_selection: {description: "Host to map: the selection changed elsewhere (selection)."}
      selection_changed: {description: "Map to host: the analyst changed the selection (selection)."}
      set_time: {description: "Host to map: current time changed elsewhere (time)."}
      time_changed: {description: "Map to host: the analyst moved current time (time)."}
      set_viewport: {description: "Host to map: show this area (viewport)."}
      viewport_changed: {description: "Map to host: the analyst panned or zoomed (viewport)."}
      show_hidden: {description: "Map to host: show every feature hidden on the map (no members)."}
      show_form: {description: "Host to form: show this tool's form (tool, selected_names, time_range of the plot, and current time if known)."}
      run_tool: {description: "Form to host: run the tool with these values (tool_name, parameters)."}
      cancel: {description: "Form to host: close without running."}
      form_busy: {description: "Host to form: the tool is running (message)."}
      form_error: {description: "Host to form: the run failed or a value was refused (message)."}
      show_results: {description: "Host to results: show a tool's result (tool, result_title, result)."}
      show_time: {description: "Host to time controller: current time, its range being the time window shown (time), the plot's whole period (time_range), the window as saved in the plot (saved_window), how tracks outside the window are drawn (context_tracks) and whether the analyst's setting shows faint as visible (minimum_context_contrast); none when no plot is open."}
      window_changed: {description: "Time controller to host: the analyst let go of the time window, or chose Keep; save it in the plot (time_range)."}
      context_changed: {description: "Time controller to host: the analyst chose how tracks outside the window are drawn; save it in the plot (context_tracks)."}
      set_context: {description: "Host to map: draw tracks outside the window this way (context_tracks), the analyst's setting already applied."}

classes:
  WebviewMessage:
    attributes:
      kind: {range: WebviewMessageKindEnum, required: true}
      plot: {range: DebriefFeatureCollection, inlined: true}
      plot_title: {}
      hidden_count:
        description: How many of the plot's features are hidden on the map (SUB-22), so the map can say so.
        range: integer
        minimum_value: 0
      selection: {range: Selection, inlined: true}
      viewport: {range: Viewport, inlined: true}
      time: {range: TimeState, inlined: true}
      saved_window:
        description: >-
          The time window as saved in the plot, so the time controller can
          say when the window shown differs from it (CAP-28).
        range: TimeRange
        inlined: true
      context_tracks:
        description: How tracks outside the time window are drawn (CAP-29).
        range: ContextTracksEnum
      minimum_context_contrast:
        description: >-
          The analyst's setting that shows faint context tracks as visible, so
          the time controller can say so.
        range: boolean
      time_range:
        description: >-
          The plot's period, so times can be entered as the analyst reads them
          (show_form) and the time window set within it (show_time); or the
          time window to save (window_changed).
        range: TimeRange
        inlined: true
      current_time:
        description: Current time from shared state, which a tool form offers for its time fields.
        range: UtcTimestamp
      tool: {range: ToolDeclaration, inlined: true}
      selected_names: {multivalued: true}
      tool_name: {}
      parameters:
        range: ParameterValue
        multivalued: true
        inlined_as_list: true
      message: {}
      result_title: {}
      result: {range: ToolResult, inlined: true}
