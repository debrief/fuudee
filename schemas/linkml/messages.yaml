id: https://debrief.info/schemas/debrief/messages
name: debrief_messages
title: "Messages between the extension host and webviews (CON-08)"
license: EPL-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  debrief: https://debrief.info/schemas/debrief/
default_prefix: debrief
default_range: string
imports:
  - linkml:types
  - core
  - features
  - state
  - tools
  - measures
  - collation
  - figures

description: >-
  Every message the VS Code extension host and its webviews (map, time
  controller, tool form, results) send each other. They cross a process boundary, so they are
  boundary types (CON-01, CON-08), validated on receipt. The same messages
  will serve the web build's host (CON-05). Which members each kind needs is
  checked by the receiver.

enums:
  TimelineEntryKindEnum:
    description: What a Timeline row is.
    permissible_values:
      narrative: {description: "A narrative entry."}
      annotation: {description: "A time-only annotation: a note or a period of interest."}
      fix_comment: {description: "A comment on one of a track's fixes."}
      coverage: {description: "A period a track has data for, from one source: the plot itself or the catalogue item supplying it (CAP-05, CAP-08)."}
  WebviewMessageKindEnum:
    permissible_values:
      ready: {description: "Webview to host: loaded and listening."}
      show_plot: {description: "Host to map: draw this plot (plot, plot_title, selection, and current time and viewport if known, and how many features are hidden); with revision_shown, an earlier revision of the plot, shown read-only."}
      set_selection: {description: "Host to map: the selection changed elsewhere (selection)."}
      selection_changed: {description: "Map to host: the analyst changed the selection (selection)."}
      set_time: {description: "Host to map: current time changed elsewhere (time)."}
      time_changed: {description: "Map to host: the analyst moved current time (time)."}
      set_viewport: {description: "Host to map: show this area (viewport)."}
      viewport_changed: {description: "Map to host: the analyst panned or zoomed (viewport)."}
      show_hidden: {description: "Map to host: show every feature hidden on the map (no members)."}
      show_form: {description: "Host to form: show this tool's form (tool, selected_names, time_range of the plot, and current time if known)."}
      run_tool: {description: "Form to host: run the tool with these values (tool_name, parameters)."}
      cancel: {description: "Form to host: close without running."}
      form_busy: {description: "Host to form: the tool is running (message)."}
      form_error: {description: "Host to form: the run failed or a value was refused (message)."}
      show_results: {description: "Host to results: show a tool's result (tool, result_title, result)."}
      show_time: {description: "Host to time controller: current time, its range being the time window shown (time), the plot's whole period (time_range), the window as saved in the plot (saved_window), how tracks outside the window are drawn (context_tracks) and whether the analyst's setting shows faint as visible (minimum_context_contrast); none when no plot is open."}
      window_changed: {description: "Time controller to host: the analyst let go of the time window, or chose Keep; save it in the plot (time_range)."}
      context_changed: {description: "Time controller to host: the analyst chose how tracks outside the window are drawn; save it in the plot (context_tracks)."}
      set_context: {description: "Host to map: draw tracks outside the window this way (context_tracks), the analyst's setting already applied."}
      show_annotation_form: {description: "Host to annotation form: add an annotation, or change the one given (annotation and feature_id); the plot's period (time_range) and current time if known."}
      save_annotation: {description: "Annotation form to host: add this annotation, or change the one named (annotation, and feature_id when changing one)."}
      delete_annotation: {description: "Annotation form to host: delete this annotation (feature_id)."}
      edit_annotation: {description: "Map to host: the analyst asked to change this annotation (feature_id): by double-clicking it, which opens its form; or, with annotation, by dragging or nudging it on the map, which changes it so as one recorded step."}
      annotation_drawn: {description: "Map to host: the analyst finished drawing an annotation on the map (annotation, its name empty); open the annotation form with it, to name it and add it as one step."}
      edit_track: {description: "Map to host: the analyst let go of a track's move, rotate, shear or stretch handle or one of its fixes, or stopped nudging one (feature_id, track_edit); change it so, as one recorded step."}
      show_fixes: {description: "Host to map: ring these fixes of a track for the analyst to check (feature_id, fix_times), such as jumps found before they are removed, and perhaps draw the track as a change would leave it (preview), with a note (message); with no feature_id, take them away."}
      show_tote: {description: "Host to Tote: the tracks that can be chosen (tote_tracks), which are chosen (tote_view) and the values at current time (tote), any of them; none when no plot is open."}
      tote_changed: {description: "Tote to host: the analyst chose a primary, added or removed a secondary, chose a measure group, or turned the map's lines on or off; save it in the plot (tote_view)."}
      set_tote: {description: "Host to map: which tracks the Tote compares (tote_view), for a thin line from the primary to each secondary at current time unless its map_lines is false; none when nothing is chosen."}
      show_timeline: {description: "Host to Timeline: what the Timeline lists (timeline_entries, in its order), the tracks a narrative entry can belong to (timeline_tracks), current time with the window shown (time), which plot it is (plot_id, so another plot is told from the same one changed) and whether the map shows the narrative entry at current time (narrative_on_map, left out meaning it does); none when no plot is open."}
      narrative_on_map_changed: {description: "Timeline to host: the analyst turned the narrative box on the map on or off (narrative_on_map); save it in the plot's island."}
      playing_changed: {description: "Time controller to host, and host to Timeline: current time started or stopped playing (playing). The Timeline follows current time again when playing starts."}
      timeline_chosen: {description: "Timeline to host: the analyst chose an entry (feature_id, the entry's id): move current time to it."}
      save_narrative: {description: "Timeline to host: add this narrative entry, or change the one named (narrative, and feature_id when changing one), as one recorded step."}
      delete_narrative: {description: "Timeline to host: delete this narrative entry (feature_id), as one recorded step."}
      open_narrative_form: {description: "Host to Timeline: open the form to add a narrative entry, or to change the one named (feature_id), as a command or an agent asked."}
      narrative_saved: {description: "Host to Timeline: the entry was added or changed (feature_id), so the form closes and the list shows it; or, with message, why it was not."}
      set_narrative: {description: "Host to map: the narrative entry current time is at, where it belongs to a track (timeline_entry), to show beside that track's marker; none to take it away."}
      undo_asked: {description: "Timeline to host: the analyst pressed Undo (Ctrl+Z; Cmd+Z on macOS) with focus in the Timeline but not in a text box: undo the plot's last step, as the map, Outline and History do (decision, product owner, 15 Oct 2026)."}
      redo_asked: {description: "Timeline to host: the analyst pressed Redo (Ctrl+Shift+Z or Ctrl+Y; Cmd+Shift+Z on macOS) with focus in the Timeline but not in a text box: redo the step last undone."}
      fix_chosen: {description: "Map to host: the analyst asked to colour, label or comment on a fix (feature_id, fix_time), by right-clicking it or pressing Enter on a fix chosen with the keyboard."}
      show_coverage: {description: "Host to Coverage: the open plot's coverage (coverage) and current time (time); none when no plot is open; or, with message alone, why what the analyst asked for was not done, leaving what is shown."}
      source_chosen: {description: "Coverage to host: the analyst chose which source supplies a period of a track (feature_id, time_range, source), as one recorded step (CAP-09)."}
      link_changed: {description: "Coverage to host: the analyst confirmed or linked (linked true), or refused or unlinked (linked false), a track in another item as the platform of the plot's track (feature_id, source), as one recorded step."}
      take_asked: {description: "Coverage to host: take the new data in this item into the plot (item_revision), as one recorded step (CAP-11)."}
      dismiss_asked: {description: "Coverage to host: set this item's new data aside for now (item_revision): its mark clears until it is revised (CAP-10)."}
      review_cleared: {description: "Coverage to host: the analyst reviewed the plot against the items revised since it drew from them; clear its review flag (CAP-12)."}
      export_image: {description: "Host to map: draw the map as an image (image_request), as the analyst sees it, at the size, in the theme and with the footer asked for (SUB-25)."}
      image_rendered: {description: "Map to host: the image drawn (image), for its ID to go into its metadata; or, with message alone, why it could not be drawn."}
      latest_asked: {description: "Map to host: the analyst asked to leave the earlier revision shown read-only and go to the plot's latest (no members)."}

classes:
  TimelineEntry:
    description: >-
      One row of the Timeline (CAP-05, CAP-20): a narrative entry, a
      time-only annotation (a note or a period) or a comment on a track's
      fix, as the Timeline lists them, in one time order.
    attributes:
      id:
        description: The narrative entry's or annotation's feature id, or fix:<track>:<time> for a fix's comment.
        required: true
      kind: {range: TimelineEntryKindEnum, required: true}
      start:
        description: Its time, or the start of its period.
        range: UtcTimestamp
        required: true
      end:
        description: The end of its period; left out for a single time.
        range: UtcTimestamp
      source:
        description: Who wrote a narrative entry; an annotation's name; the track a fix comment is on; the item supplying a period of data.
        required: true
      entry_type: {description: "A narrative entry's type, in its source's words."}
      text: {description: "Its text."}
      track: {description: "The track it belongs to: a narrative entry's track, or a fix's."}
      colour:
        description: That track's colour, lower-case hex RGB.
        pattern: "^#[0-9a-f]{6}$"
      hidden: {range: boolean, description: "An annotation or track hidden on the map."}

  WebviewMessage:
    attributes:
      kind: {range: WebviewMessageKindEnum, required: true}
      plot: {range: DebriefFeatureCollection, inlined: true}
      plot_title: {}
      hidden_count:
        description: How many of the plot's features are hidden on the map (SUB-22), so the map can say so.
        range: integer
        minimum_value: 0
      selection: {range: Selection, inlined: true}
      viewport: {range: Viewport, inlined: true}
      time: {range: TimeState, inlined: true}
      saved_window:
        description: >-
          The time window as saved in the plot, so the time controller can
          say when the window shown differs from it (CAP-28).
        range: TimeRange
        inlined: true
      context_tracks:
        description: How tracks outside the time window are drawn (CAP-29).
        range: ContextTracksEnum
      minimum_context_contrast:
        description: >-
          The analyst's setting that shows faint context tracks as visible, so
          the time controller can say so.
        range: boolean
      time_range:
        description: >-
          The plot's period, so times can be entered as the analyst reads them
          (show_form) and the time window set within it (show_time); the time
          window to save (window_changed); or the period whose source the
          analyst chose (source_chosen).
        range: TimeRange
        inlined: true
      current_time:
        description: Current time from shared state, which a tool form offers for its time fields.
        range: UtcTimestamp
      tool: {range: ToolDeclaration, inlined: true}
      selected_names: {multivalued: true}
      tool_name: {}
      parameters:
        range: ParameterValue
        multivalued: true
        inlined_as_list: true
      message: {}
      result_title: {}
      result: {range: ToolResult, inlined: true}
      annotation:
        description: >-
          An annotation as the form describes it (show_annotation_form,
          save_annotation), as drawn on the map (annotation_drawn), or as
          changed on the map (edit_annotation).
        range: AnnotationSpec
        inlined: true
      feature_id:
        description: The narrative entry the Timeline chose, changes or deletes, the annotation a form changes or deletes, the annotation or track the map asks to change, or the track whose fixes it rings or the analyst chose.
      track_edit:
        description: How the analyst moved, rotated, sheared or stretched a track, or moved one of its fixes, on the map (edit_track).
        range: TrackEdit
        inlined: true
      fix_times:
        description: The times of the fixes the map rings (show_fixes).
        range: UtcTimestamp
        multivalued: true
      fix_time:
        description: The time of the fix the analyst chose on the map (fix_chosen).
        range: UtcTimestamp
      preview:
        description: >-
          A track as a change would leave it, one position per fix, drawn
          beside it until the analyst applies or cancels the change
          (show_fixes).
        range: LineStringGeometry
        inlined: true
      tote:
        description: The Tote's values at current time (show_tote).
        range: ToteResult
        inlined: true
      tote_view:
        description: Which tracks the Tote compares, as saved in the plot (show_tote, set_tote) or as the analyst chose (tote_changed).
        range: ToteView
        inlined: true
      timeline_entries:
        description: The Timeline's rows, in its order (show_timeline).
        range: TimelineEntry
        multivalued: true
        inlined_as_list: true
      timeline_entry:
        description: The narrative entry current time is at, to show on the map beside its track (set_narrative).
        range: TimelineEntry
        inlined: true
      plot_id:
        description: >-
          Which plot is open, as its host knows it (show_timeline): a list read
          again for the same plot keeps the reader's place; another plot is read
          from current time.
      narrative_on_map:
        description: >-
          Whether the map shows the narrative entry current time is at beside
          its track (show_timeline, narrative_on_map_changed): the plot's
          PlotView.narrative_on_map; left out means it does.
        range: boolean
      playing:
        description: Whether current time is playing (playing_changed).
        range: boolean
      timeline_tracks:
        description: The plot's tracks, which a narrative entry can belong to (show_timeline).
        range: ToteTrack
        multivalued: true
        inlined_as_list: true
      narrative:
        description: A narrative entry as the Timeline's form describes it (save_narrative).
        range: NarrativeSpec
        inlined: true
      tote_tracks:
        description: The plot's tracks, which the analyst can choose from for the Tote (show_tote).
        range: ToteTrack
        multivalued: true
        inlined_as_list: true
      coverage:
        description: The open plot's coverage (show_coverage).
        range: CoverageReport
        inlined: true
      source:
        description: A track in a catalogue item (source_chosen, link_changed).
        range: SourceTrackRef
        inlined: true
      linked:
        description: Whether the source is the track's platform (link_changed).
        range: boolean
      item_revision:
        description: The item, at the revision the analyst saw (take_asked, dismiss_asked).
        range: ItemRevision
        inlined: true
      image_request:
        description: What image to draw, and how (export_image).
        range: ImageRequest
        inlined: true
      image:
        description: The image the map drew (image_rendered).
        range: RenderedImage
        inlined: true
      revision_shown:
        description: The plot shown is an earlier revision, read-only (show_plot).
        range: RevisionShown
        inlined: true
