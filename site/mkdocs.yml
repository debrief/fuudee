site_name: Debrief v4
site_description: Development blog and guides for Debrief v4
# A pull-request preview is published below this, at pr-preview/pr-N/.
site_url: !ENV [SITE_URL, "https://debrief.github.io/fuudee/"]
repo_url: https://github.com/debrief/fuudee
repo_name: debrief/fuudee
edit_uri: edit/main/site/docs/
copyright: Debrief is open source under the Eclipse Public License 2.0.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy

hooks:
  - hooks/guides_nav.py
  - hooks/page_map.py
  - hooks/preview_banner.py

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: d MMMM yyyy
      post_url_format: "{date}/{slug}"
      archive: false
      categories_allowed: [Architecture, Practice, Capability]

extra_javascript:
  - javascripts/demo.js
extra_css:
  - stylesheets/demo.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Try Debrief: try.md
  - Blog:
      - blog/index.md
  # Built from the folder (hooks/guides_nav.py): its index first, then each guide in the order
  # its folder's index links to them, named by its heading. A new guide needs only that link.
  - Guides: guides/
