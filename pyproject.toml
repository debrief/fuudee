[project]
name = "debrief-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[dependency-groups]
dev = [
    "debrief-kernel",
    "debrief-schemas",
    "linkml==1.12.0",
    "pytest>=8",
    "ruff>=0.6",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material==9.7.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["python/*/src/*/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["debrief_kernel", "debrief_schemas"]

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = ["--import-mode=importlib"]

[tool.uv.sources]
debrief-kernel = { workspace = true }
debrief-schemas = { workspace = true }
