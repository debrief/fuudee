name: CI

on:
  push:
    branches: [main]
  pull_request:

# The uv every job installs, pinned: unpinned, setup-uv looks up the latest release on every
# job, so a new release can change a run unannounced. This is the version CI last resolved.
# The same in ci.yml, pages.yml and preview.yml.
env:
  UV_VERSION: "0.13.7"

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ts/schemas/package-lock.json
            ts/kernel/package-lock.json
            ts/config/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix ts/schemas
          npm ci --prefix ts/kernel
          npm ci --prefix ts/config
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Generated types are up to date
        run: |
          uv run python scripts/generate_schemas.py --check
          npm run --prefix ts/schemas generate -- --check
      - name: Python tests
        run: uv run pytest
      - name: Performance budgets, reported and never blocking (docs/engineering.md)
        continue-on-error: true
        env:
          DEBRIEF_PERF: "1"
        run: |
          uv run pytest python/debrief-tools/tests/test_tote_latency.py -q || over=1
          npm run --prefix ts/schemas build
          npm test --prefix ts/kernel -- tma || over=1
          exit ${over:-0}
      - name: TypeScript typecheck and tests
        run: |
          npm run --prefix ts/schemas typecheck
          npm test --prefix ts/schemas
      - name: TypeScript kernel (formatting held to the shared vectors)
        run: |
          npm run --prefix ts/schemas build
          npm run --prefix ts/kernel typecheck
          npm test --prefix ts/kernel
      - name: TypeScript configuration (location rules held to the shared vectors)
        run: |
          npm run --prefix ts/config typecheck
          npm test --prefix ts/config
      - name: Cross-language round trip
        run: scripts/cross_language_roundtrip.sh

  vscode:
    # The extension: typecheck, unit tests, theme-token, terminology and panel checks
    # (DEV-10; review of 7 Nov 2026, finding 7), then the Phase 1 tracer in real VS Code with the real Python
    # tool service. Screenshots of each step are kept as a build artifact.
    # The tracer runs in each VS Code version below side by side, one job each;
    # the checks before it run once, in the newest's job.
    name: vscode (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The VS Code versions the tracer runs in, kept here only: the newest
        # (also run.ts's default), and the oldest supported (engines.vscode).
        include:
          - vscode: "1.141.0"
            checks: true
          - vscode: "1.95.0"
            checks: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ts/schemas/package-lock.json
            ts/kernel/package-lock.json
            ts/config/package-lock.json
            vscode/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          for package in schemas kernel config; do
            npm ci --prefix ts/$package
            npm run --prefix ts/$package build
          done
          npm ci --prefix vscode
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Typecheck, unit tests and guide checks
        if: matrix.checks
        working-directory: vscode
        run: |
          npm run typecheck
          npm test
          npm run check:theme
          npm run check:language
          npm run check:panels
      - name: Performance budgets, reported and never blocking (docs/engineering.md)
        if: matrix.checks
        continue-on-error: true
        working-directory: vscode
        env:
          DEBRIEF_PERF: "1"
        run: npx vitest run --project unit coverage timeline sensors
      - uses: actions/cache@v4
        with:
          path: vscode/.vscode-test
          key: vscode-test-${{ matrix.vscode }}
      - name: Tracer in VS Code ${{ matrix.vscode }}
        # The suite fails itself after 20 minutes; this covers VS Code hanging outside it.
        timeout-minutes: 30
        working-directory: vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
          DEBRIEF_SCREENSHOTS: ${{ github.workspace }}/screenshots
          DEBRIEF_PARITY_OUT: ${{ github.workspace }}/parity
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-screenshots-${{ matrix.vscode }}
          path: screenshots
          if-no-files-found: ignore
      # The cross-host parity check's result in this VS Code, for the parity job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-vscode-${{ matrix.vscode }}
          path: parity
          if-no-files-found: ignore

  site:
    # The blog and guides must build without warnings (DEV-01, DEV-07, DEV-08).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs mkdocs build --strict --config-file site/mkdocs.yml

  playground-parts:
    # The playground's parts, made from the plays themselves: each module in vscode/test/play
    # exports its plays with their costs, and test/play/shards.mjs shares them out into as many
    # parts as keep each to about four minutes, each unit of plays from a fresh page (review of
    # 7 Nov 2026, finding 5). A new play needs no edit here. Node only: the plays' modules
    # import nothing installed.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: parts
        working-directory: vscode
        run: |
          node test/play/shards.mjs
          echo "matrix=$(node test/play/shards.mjs --matrix)" >> "$GITHUB_OUTPUT"

  playground-part:
    # The blog's playable demos: Debrief's webviews and Python, in the browser
    # (CON-09). Builds the playground and the site, then plays this part's demos in
    # Chromium as a reader would, including demos started from blog posts.
    name: playground (part ${{ matrix.part }})
    needs: playground-parts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.playground-parts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ts/schemas/package-lock.json
            ts/kernel/package-lock.json
            ts/config/package-lock.json
            vscode/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          for package in schemas kernel config; do
            npm ci --prefix ts/$package
            npm run --prefix ts/$package build
          done
          npm ci --prefix vscode
          (cd vscode && npx playwright install --with-deps chromium)
      - name: Build the playground and the site
        run: |
          scripts/build_playground.sh
          uv run --only-group docs mkdocs build --strict --config-file site/mkdocs.yml
      - name: "Play: ${{ matrix.plays }}"
        working-directory: vscode
        env:
          DEBRIEF_PLAY_PART: ${{ matrix.part }}
          DEBRIEF_PLAY_PARTS: ${{ matrix.of }}
          DEBRIEF_SCREENSHOTS: ${{ github.workspace }}/playground-screenshots
          # On pull requests, only the page as it failed: a screenshot of every step costs minutes.
          DEBRIEF_SCREENSHOTS_ON: ${{ github.event_name == 'pull_request' && 'failure' || 'every-step' }}
          DEBRIEF_PARITY_OUT: ${{ github.workspace }}/parity
        run: mkdir -p "$DEBRIEF_SCREENSHOTS" && npm run test:play
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-screenshots-${{ matrix.part }}
          path: playground-screenshots
          if-no-files-found: ignore
      # The cross-host parity check's result in the playground, from whichever part played it, for the parity job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-playground-${{ matrix.part }}
          path: parity
          if-no-files-found: ignore

  playground:
    # The check pull requests wait on: every part of the playground played (the parts made, and
    # every matrix entry of playground-part; any one failed, cancelled or skipped fails it).
    needs: [playground-parts, playground-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.playground-parts.result }}" = success && test "${{ needs.playground-part.result }}" = success

  parity:
    # The cross-host parity check (vscode/test/parity): the same shared commands run in
    # VS Code (each version's tracer) and in the playground, from the same plot; the
    # plot each left, projected, must be the same. Runs whatever the jobs before it did,
    # so a host whose run failed before writing its result fails this too.
    needs: [vscode, playground-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*
          path: parity
      - name: Compare the plot each host left
        working-directory: vscode
        run: |
          results=()
          for version in 1.141.0 1.95.0; do results+=("../parity/parity-vscode-$version/vscode.json"); done
          # The playground's, from whichever part played the parity check.
          playground=$(ls ../parity/parity-playground-*/playground.json 2>/dev/null | head -n 1 || true)
          playground=${playground:-../parity/parity-playground-N/playground.json}
          for file in "$playground" "${results[@]}"; do
            test -f "$file" || { echo "::error::$file is missing: that host's run did not finish the parity check"; exit 1; }
          done
          node test/parity/compare.mjs "$playground" "${results[@]}"

  pyodide:
    # Python tools must run in the browser for the web build (CON-09). Runs the
    # same smoke test under CPython and Pyodide and requires identical results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/pyodide/package-lock.json
      - uses: actions/cache@v4
        with:
          path: spikes/pyodide/.pyodide-cache
          key: pyodide-${{ hashFiles('spikes/pyodide/package-lock.json') }}
      - run: uv sync --locked
      - run: spikes/pyodide/run.sh
