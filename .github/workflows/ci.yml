name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/schemas/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix ts/schemas
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Generated types are up to date
        run: |
          uv run python scripts/generate_schemas.py --check
          npm run --prefix ts/schemas generate -- --check
      - name: Python tests
        run: uv run pytest
      - name: TypeScript typecheck and tests
        run: |
          npm run --prefix ts/schemas typecheck
          npm test --prefix ts/schemas
      - name: Cross-language round trip
        run: scripts/cross_language_roundtrip.sh
