name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ts/schemas/package-lock.json
            ts/kernel/package-lock.json
            ts/config/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix ts/schemas
          npm ci --prefix ts/kernel
          npm ci --prefix ts/config
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Generated types are up to date
        run: |
          uv run python scripts/generate_schemas.py --check
          npm run --prefix ts/schemas generate -- --check
      - name: Python tests
        run: uv run pytest
      - name: TypeScript typecheck and tests
        run: |
          npm run --prefix ts/schemas typecheck
          npm test --prefix ts/schemas
      - name: TypeScript kernel (formatting held to the shared vectors)
        run: |
          npm run --prefix ts/schemas build
          npm run --prefix ts/kernel typecheck
          npm test --prefix ts/kernel
      - name: TypeScript configuration (location rules held to the shared vectors)
        run: |
          npm run --prefix ts/config typecheck
          npm test --prefix ts/config
      - name: Cross-language round trip
        run: scripts/cross_language_roundtrip.sh

  vscode:
    # The extension: typecheck, unit tests, theme-token and terminology checks
    # (DEV-10), then the Phase 1 tracer in real VS Code with the real Python
    # tool service. Screenshots of each step are kept as a build artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ts/schemas/package-lock.json
            ts/kernel/package-lock.json
            ts/config/package-lock.json
            vscode/package-lock.json
      - name: Install
        run: |
          uv sync --locked
          for package in schemas kernel config; do
            npm ci --prefix ts/$package
            npm run --prefix ts/$package build
          done
          npm ci --prefix vscode
          sudo apt-get install -y --no-install-recommends imagemagick
      - name: Typecheck, unit tests and guide checks
        working-directory: vscode
        run: |
          npm run typecheck
          npm test
          npm run check:theme
          npm run check:language
      - name: Tracer in VS Code
        working-directory: vscode
        env:
          DEBRIEF_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-screenshots
          path: screenshots
          if-no-files-found: ignore

  site:
    # The blog and guides must build without warnings (DEV-01, DEV-07, DEV-08).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs mkdocs build --strict --config-file site/mkdocs.yml

  pyodide:
    # Python tools must run in the browser for the web build (CON-09). Runs the
    # same smoke test under CPython and Pyodide and requires identical results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/pyodide/package-lock.json
      - uses: actions/cache@v4
        with:
          path: spikes/pyodide/.pyodide-cache
          key: pyodide-${{ hashFiles('spikes/pyodide/package-lock.json') }}
      - run: uv sync --locked
      - run: spikes/pyodide/run.sh
