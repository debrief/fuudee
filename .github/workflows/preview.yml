name: Preview site

# A pull request that changes the site gets a live copy of it at
# https://debrief.github.io/fuudee/pr-preview/pr-N/, linked from a comment and
# removed when the pull request closes. Screenshots of the pages it changes go
# in its description, kept on the pr-screenshots branch so they outlive the
# preview. Pull requests from forks get neither: they cannot write here.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths: ["site/**", "scripts/build_site.sh", "scripts/preview_shots.mjs", "pyproject.toml", "uv.lock", ".github/workflows/preview.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "22"
      - name: Build the site
        if: github.event.action != 'closed'
        env:
          SITE_URL: https://debrief.github.io/fuudee/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: scripts/build_site.sh preview-site
      - name: Screenshot the pages this pull request changes
        if: github.event.action != 'closed'
        run: |
          export PLAYWRIGHT_DIR="$RUNNER_TEMP/playwright"
          npm install --no-save --prefix "$PLAYWRIGHT_DIR" playwright@1.56.1
          (cd "$PLAYWRIGHT_DIR" && npx playwright install --with-deps chromium)
          git diff --name-only "${{ github.event.pull_request.base.sha }}...$SHA" > changed.txt
          node scripts/preview_shots.mjs preview-site "shots/pr-$PR/${SHA::7}" $(cat changed.txt)
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview-site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.event.action != 'closed'
        with:
          branch: pr-screenshots
          folder: shots
          clean: false
          commit-message: Screenshots for pull request ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}
      - name: Put the preview and screenshots in the description
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { PR, SHA } = process.env;
            const folder = `pr-${PR}/${SHA.slice(0, 7)}`;
            const { shots, more } = JSON.parse(fs.readFileSync(`shots/${folder}/shots.json`, "utf8"));
            const preview = `https://debrief.github.io/fuudee/pr-preview/pr-${PR}/`;
            const raw = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/pr-screenshots/${folder}`;
            const lines = [
              "<!-- site-preview:start -->",
              "## Site preview",
              "",
              `Live preview: ${preview} (updated for ${SHA.slice(0, 7)}; it can take a minute to appear).`,
              "",
              ...shots.flatMap((s) => [
                `<details open><summary><a href="${preview}${s.url}">${s.title}</a> (<code>${s.source}</code>)</summary>`,
                "",
                `<img src="${raw}/${s.file}" width="640" alt="Screenshot of ${s.title}">`,
                "</details>",
                "",
              ]),
              ...(more ? [`And ${more} more changed page(s); see the preview.`, ""] : []),
              "<!-- site-preview:end -->",
            ];
            const section = lines.join("\n");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(PR) });
            const body = pr.body ?? "";
            const marked = /<!-- site-preview:start -->[\s\S]*<!-- site-preview:end -->/;
            const updated = marked.test(body) ? body.replace(marked, () => section) : `${body}\n\n${section}`;
            await github.rest.pulls.update({ ...context.repo, pull_number: Number(PR), body: updated });
