name: Publish site

# Builds the blog and guides from main and publishes them to the gh-pages
# branch, which GitHub Pages serves (DEV-01). Each publish is a new commit on
# gh-pages replacing its contents; history is kept, nothing is force-pushed.
on:
  push:
    branches: [main]
    paths: ["site/**", "pyproject.toml", "uv.lock", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --only-group docs
      - name: Build and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --only-group docs mkdocs gh-deploy --strict --config-file site/mkdocs.yml \
            --remote-branch gh-pages --message "Publish site from {sha}"
