name: Publish site

# Builds the blog and guides from main and publishes them to GitHub Pages (DEV-01).
# Requires Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "pyproject.toml", "uv.lock", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --only-group docs
      - run: uv run --only-group docs mkdocs build --strict --config-file site/mkdocs.yml --site-dir ../_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
