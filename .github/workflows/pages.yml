name: Publish site

# Builds the blog and guides from main and publishes them to the gh-pages
# branch, which GitHub Pages serves (DEV-01). Each publish is a new commit on
# gh-pages replacing its contents, apart from pull-request previews under
# pr-preview/ (preview.yml); history is kept, nothing is force-pushed.
on:
  push:
    branches: [main]
    # The playground (site/docs/play) is built from the extension and the Python packages.
    paths: ["site/**", "python/**", "ts/**", "vscode/**", "scripts/build_site.sh", "scripts/build_playground.sh", "pyproject.toml", "uv.lock", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

# The uv every job installs, pinned: unpinned, setup-uv looks up the latest release on every
# job, so a new release can change a run unannounced. This is the version CI last resolved.
# The same in ci.yml, pages.yml and preview.yml.
env:
  UV_VERSION: "0.13.7"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: scripts/build_site.sh site/site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/site
          clean-exclude: pr-preview/
          commit-message: Publish site from ${{ github.sha }}
