[project]
name = "debrief-config"
version = "0.0.1"
description = "Debrief per-user configuration: the stores an analyst knows about"
requires-python = ">=3.12"
dependencies = [
    "debrief-schemas",
]

[tool.uv.sources]
debrief-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_config"]
