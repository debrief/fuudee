[project]
name = "debrief-io"
version = "0.0.1"
description = "Debrief importers: legacy formats into validated plots with provenance"
requires-python = ">=3.12"
dependencies = [
    "debrief-kernel",
    "debrief-schemas",
    "debrief-stac",
    "olefile>=0.47",
    "pypdf>=6",
]

[tool.uv.sources]
debrief-kernel = { workspace = true }
debrief-schemas = { workspace = true }
debrief-stac = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_io"]
