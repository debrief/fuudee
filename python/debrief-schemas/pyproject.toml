[project]
name = "debrief-schemas"
version = "0.0.1"
description = "Debrief data-file schema: Pydantic models generated from LinkML"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_schemas"]
