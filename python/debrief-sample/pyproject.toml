[project]
name = "debrief-sample"
version = "0.0.1"
description = "Debrief sample data: open AIS with a synthesised exercise on top (DEP-08)"
requires-python = ">=3.12"
dependencies = [
    "debrief-io",
    "debrief-kernel",
    "debrief-schemas",
    "debrief-stac",
    "pyarrow>=17",
]

[tool.uv.sources]
debrief-io = { workspace = true }
debrief-kernel = { workspace = true }
debrief-schemas = { workspace = true }
debrief-stac = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_sample"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "debrief_sample/data"
