[project]
name = "debrief-kernel"
version = "0.0.1"
description = "Debrief substrate kernel: UTC time, units, geodesy and display formatting (SUB-01 to SUB-04)"
requires-python = ">=3.12"
dependencies = [
    "debrief-schemas",
    "geographiclib>=2.0",
    "numpy>=2.0",
    "pyproj>=3.7",
    "tzdata>=2024.1",
]

[tool.uv.sources]
debrief-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_kernel"]
