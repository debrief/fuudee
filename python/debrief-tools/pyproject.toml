[project]
name = "debrief-tools"
version = "0.0.1"
description = "Debrief tool service: tools discovered at runtime, offered by selection, served over MCP"
requires-python = ">=3.12"
dependencies = [
    "debrief-config",
    "debrief-kernel",
    "debrief-schemas",
    "debrief-stac",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
]

# Tool libraries register here; Debrief finds them when it starts (TL-05).
[project.entry-points."debrief.tools"]
core = "debrief_tools.core"

[tool.uv.sources]
debrief-config = { workspace = true }
debrief-kernel = { workspace = true }
debrief-schemas = { workspace = true }
debrief-stac = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_tools"]
