[project]
name = "debrief-stac"
version = "0.0.1"
description = "Debrief catalogues: plots and their sources in static, file-based STAC catalogues"
requires-python = ">=3.12"
dependencies = [
    "debrief-kernel",
    "debrief-schemas",
]

[tool.uv.sources]
debrief-kernel = { workspace = true }
debrief-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_stac"]
